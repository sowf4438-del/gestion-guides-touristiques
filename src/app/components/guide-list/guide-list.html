<section class="guides-container">
  <h2>Guides touristiques au Sénégal</h2>

  <div class="guides-grid" *ngIf="guides$ | async as guides">
    <article class="guide-card" *ngFor="let guide of guides">
      <div class="guide-header">
        <h3>{{ guide.prenom }} {{ guide.nom }}</h3>
        <span class="statut">{{ guide.statut }}</span>
      </div>

      <p><strong>Spécialité :</strong> {{ guide.specialite }}</p>
      <p><strong>Région :</strong> {{ guide.region }}</p>
      <p><strong>Téléphone :</strong> {{ guide.telephone }}</p>
      <p><strong>Email :</strong> {{ guide.email }}</p>
      <p><strong>Note :</strong> {{ guide.note }} / 5</p>

      <button type="button" (click)="supprimerGuide(guide.id)">
        Supprimer
      </button>
    </article>
  </div>
</section>
